<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Code Atlas · 程式地圖</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="atlas-library.css">
  <script defer src="vendor/d3.v7.min.js"></script>
  <script defer src="data/index.js"></script>
  <script defer src="atlas-package.js"></script>
  <script defer src="atlas-library.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#details">跳至功能說明</a>
  <header class="toolbar">
    <button class="brand" id="home" aria-label="Code Atlas 回到全景">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11"/><circle cx="10" cy="11" r="4"/><circle cx="18" cy="17" r="5"/><circle cx="18" cy="17" r="1.5"/></svg>
      <span>Code Atlas</span>
    </button>
    <span class="project-name" id="project-name"></span>
    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="search-input">搜尋名稱、功能或程式位置</label>
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="search-input" type="search" placeholder="搜尋功能或程式位置" autocomplete="off" aria-controls="search-results">
      <button type="submit">搜尋</button>
      <div class="search-results" id="search-results" hidden></div>
    </form>
    <a id="globe" class="quiet-button" href="index.html">地球儀檢視</a>
  </header>
  <div class="location-bar">
    <nav id="breadcrumbs" aria-label="地圖位置"></nav>
    <button id="coverage" class="coverage" title="覆蓋率以原始文件計算，隱藏項目仍納入"></button>
  </div>
  <main class="workspace">
    <section class="map-pane" aria-labelledby="map-title">
      <div class="map-heading"><div><h1 id="map-title">專案全景</h1><p id="map-subtitle">由系統開始，探索每一個功能。</p></div><button id="back" class="quiet-button" hidden>返回上一層</button></div>
      <div class="map-stage" id="map-stage">
        <svg id="map" viewBox="0 0 760 640" role="group" aria-label="可縮放的程式地圖"></svg>
        <div class="map-message" id="map-message" hidden></div>
      </div>
      <div class="map-bottom"><span id="map-count"></span><span class="map-hint">點選圓形深入探索 · Esc 返回</span></div>
      <div class="legend" aria-label="圖例"><span class="legend-country">國家／系統</span><span class="legend-city">城市／模組</span><span class="legend-town">鄉鎮／功能</span><span class="legend-resident">鎮民／規則項目</span></div>
    </section>
    <aside class="detail-pane" id="details" tabindex="-1" aria-label="功能說明">
      <div id="detail-content"></div>
    </aside>
  </main>
  <footer class="footer"><span>程式的結構，業務的全貌。</span><span id="build-time"></span></footer>
  <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  <noscript>請啟用 JavaScript，以使用三層縮放地圖。原始說明保存在 .atlas/nodes/。</noscript>
</body>
</html>
