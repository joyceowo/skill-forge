<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f6fa">
  <title>Code Atlas · 架構地圖</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2302050b'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%238fe3ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='13.5' fill='none' stroke='%238fe3ff' stroke-width='.8' stroke-dasharray='1.5 3'/%3E%3Ccircle cx='22.7' cy='9.3' r='1.8' fill='%23ffcf7a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="globe.css">
  <link rel="stylesheet" href="atlas-library.css">
  <script defer src="vendor/d3.v7.min.js"></script>
  <script defer src="vendor/d3-weighted-voronoi.js"></script>
  <script defer src="vendor/d3-voronoi-map.js"></script>
  <script defer src="vendor/d3-voronoi-treemap.js"></script>
  <script defer src="data/index.js"></script>
  <script defer src="atlas-package.js"></script>
  <script defer src="atlas-library.js"></script>
  <script defer src="globe.js"></script>
</head>
<body>
  <a class="skip-link" href="#inspector">跳至說明</a>
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <header class="masthead topbar">
      <button class="brand" id="home" type="button" aria-label="Code Atlas，回到軌道全景">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9.5"/><circle class="brand-orbit" cx="16" cy="16" r="14"/><circle class="brand-moon" cx="25.9" cy="6.1" r="1.9"/></svg>
        <span class="brand-word">Code Atlas</span>
      </button>
      <span class="project"><span id="project-name"></span></span>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">搜尋功能、API 或程式檔</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="search-input" type="search" placeholder="搜尋功能、API 或程式檔" autocomplete="off" aria-controls="search-results">
        <kbd aria-hidden="true">/</kbd>
        <div class="search-results" id="search-results" hidden></div>
      </form>
      <a class="switch-view" id="classic" href="classic.html">圓形檢視</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"></button>
    </header>

    <main>
    <section class="stage" id="stage" aria-labelledby="view-title">
      <div class="titleblock" id="titleblock">
        <nav class="crumbs" id="crumbs" aria-label="目前位置"></nav>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="view-title" tabindex="-1"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>

      <div class="orbit-labels" id="orbit-labels" role="group" aria-label="星球上的系統，點擊降落"></div>
      <div class="reticle" id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="layers" id="layers"></div>
      <div class="stage-message" id="stage-message" role="status" hidden></div>

      <nav class="rail" id="rail" aria-label="高度計：縮放層級"></nav>
      <p class="hud" id="hud" aria-hidden="true"></p>

      <div class="dock" id="dock">
        <button class="dock-zoom" id="zoom-out" type="button" aria-label="升高一層"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
        <button class="dock-main" id="dock-main" type="button"><kbd id="dock-key">Esc</kbd><span id="dock-label">返回上一層</span></button>
        <button class="dock-zoom" id="zoom-in" type="button" aria-label="降落一層"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
      </div>
      <p class="keys" id="keys" aria-hidden="true"></p>
    </section>

    <aside class="inspector" id="inspector" tabindex="-1" aria-label="說明">
      <div class="insp-head" id="insp-head"></div>
      <div class="insp-body" id="insp-body"></div>
    </aside>
    </main>
  </div>

  <div class="sr-only" id="status" role="status" aria-live="polite"></div>
  <noscript>請啟用 JavaScript，以使用分層架構地圖。</noscript>
</body>
</html>
